name: gesavo

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gesavo}
      POSTGRES_USER: ${POSTGRES_USER:-gesavo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesavo} -d ${POSTGRES_DB:-gesavo}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    image: gesavo-backend
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: 5432
      DJANGO_DB_SSLMODE: disable
      DJANGO_PRIVATE_DOCUMENT_ROOT: /private-documents
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - private_documents:/private-documents
    depends_on:
      postgres:
        condition: service_healthy

  task-archiver:
    image: gesavo-backend
    build:
      context: ./backend
    command: python manage.py archive_completed_tasks --watch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: 5432
      DJANGO_DB_SSLMODE: disable
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: gesavo_postgres_data
  private_documents:
    name: gesavo_private_documents
